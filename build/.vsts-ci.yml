name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

# lts_03_2025: taken from master; the submodule check is replaced by a branch-agnostic
# consistency check and the x86 job, disabled on master for a c-logging issue, runs here.

# NOTE: This pipeline was migrated off the internal csdkcontainerregistry
# container images and the self-hosted 'sdk-c--*' agent pools (which are no
# longer available) onto Microsoft-hosted vmImage agents, mirroring the
# structural fixes applied to azure-c-shared-utility/build/.vsts-ci.yml.
#
# utpm has no E2E tests, so the IoT Hub / DPS secret env blocks that used
# to be plumbed into every job have been removed. The 'Download secrets:
# c-production' task is also dropped -- the c-production key vault rejects
# requests from non-master branches and the secrets are not needed for
# unit tests.
#
# utpm has no jenkins/linux_wolfssl.sh, no jenkins/linux_install_deps.sh,
# no jenkins/ubuntu_clang.sh, no jenkins/linux_c_option_test.sh, no
# jenkins/windows_c_build_as_dynamic.cmd, and no jenkins/osx_*.sh scripts
# (only unsupport_osx_* exist), so the wolfssl, OSX, XCode Native, Linux
# Ubuntu Clang, Linux Ubuntu with Options and Windows Dynamic jobs are
# not present in this pipeline.

resources:
  - repo: self
    clean: true

jobs:
- job: checksubmodule
  variables:
    CodeQL.Enabled: false
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Check Submodules'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  # 'check_submodules . master' compares this branch against master and cannot
  # pass on a maintenance branch. Instead verify the recursive submodule graph
  # agrees with itself: every reference to the same repository pins one commit.
  - script: |
      set -e
      tmp=$(mktemp); norm=$(mktemp)
      git submodule foreach --recursive --quiet \
        'echo "$(git config --get remote.origin.url) $(git rev-parse HEAD) $displaypath"' > "$tmp"
      awk '{ u=$1; sub(/^https:\/\/github\.com\//,"",u); sub(/^git@github\.com:/,"",u);
             sub(/\.git$/,"",u); print tolower(u), $2, $3 }' "$tmp" | sort -u > "$norm"
      conflicts=$(awk '{print $1, $2}' "$norm" | sort -u | awk '{c[$1]++} END{for(r in c) if(c[r]>1) print r}')
      if [ -n "$conflicts" ]; then
        echo "Submodule consistency check FAILED; conflicting commits:"
        for r in $conflicts; do
          echo "  $r"
          awk -v r="$r" '$1==r{print "    "$2"  "$3}' "$norm"
        done
        exit 1
      fi
      echo "Submodule consistency check passed ($(wc -l < "$norm") references)."
    displayName: 'Check Submodule Consistency'

- job: windowsx86
  timeoutInMinutes: 90
  pool:
    vmImage: 'windows-2022'
  displayName: 'Windows x86'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      call jenkins\windows_c_VsDevCmd.cmd && call jenkins\windows_c.cmd
    displayName: 'Build'
  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'

- job: windowsx64
  timeoutInMinutes: 90
  variables:
    CodeQL.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
    CodeQL.Language: cpp
  pool:
    vmImage: 'windows-2022'
  displayName: 'Windows x64'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - task: CodeQL3000Init@0
  - script: |
      call jenkins\windows_c_VsDevCmd.cmd x64 && call jenkins\windows_c.cmd --platform x64
    displayName: 'Build'
  - task: CodeQL3000Finalize@0
    condition: always()
  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'

- job: ubuntu2404
  timeoutInMinutes: 90
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Ubuntu 24.04'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev \
        valgrind
    displayName: 'Host setup'
  - script: |
      export OPENSSL_ia32cap=0x00000000
      sudo chmod -R 755 .
      sudo -E ./jenkins/ubuntu_c.sh
    displayName: 'Build'

- job: debian
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Linux Debian (Buster)'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        curl \
        libcurl4-openssl-dev \
        libssl-dev \
        uuid-dev
    displayName: 'Host setup'
  - script: |
      sudo chmod 755 jenkins/debian_c.sh
      sudo -E ./jenkins/debian_c.sh
    displayName: 'Build'

- job: raspberrypi
  # ARM cross-compile replacement for the retired raspberrypi-c-buster
  # container. We cross-compile with the arm-linux-gnueabihf toolchain on
  # an x64 Microsoft-hosted agent. Tests are NOT executed; runtime ARM
  # validation is the responsibility of downstream consumers.
  timeoutInMinutes: 60
  pool:
    vmImage: 'ubuntu-24.04'
  displayName: 'Raspberry Pi (Cross-compile only)'
  steps:
  - script: git config --global core.longpaths true
    displayName: 'Enable git longpaths'
  - checkout: self
    submodules: recursive
  - script: |
      set -e
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        build-essential \
        pkg-config \
        crossbuild-essential-armhf
    displayName: 'Install armhf cross toolchain'
  - script: |
      set -e
      mkdir -p cmake-armhf
      cd cmake-armhf
      cmake \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_SYSTEM_PROCESSOR=arm \
        -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
        -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
        -DCMAKE_BUILD_TYPE=Debug \
        -Drun_unittests:BOOL=OFF \
        -Dskip_samples:BOOL=ON \
        -Duse_installed_dependencies:BOOL=OFF \
        -Duse_default_uuid:BOOL=ON \
        -Duse_http:BOOL=OFF \
        -Duse_openssl:BOOL=OFF \
        ..
      # use_http=OFF disables c-utility's CURL probe, which would otherwise
      # require libcurl4-openssl-dev:armhf (not packaged on hosted agents).
      # use_openssl=OFF for the same reason re: libssl-dev:armhf.
      make -j$(nproc)
    displayName: 'Cross-compile utpm for armhf'
